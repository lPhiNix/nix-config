name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  list-hosts:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - id: hosts
        run: echo "hosts=$(nix eval --json --apply 'builtins.attrNames' .#nixosConfigurations)" >> "$GITHUB_OUTPUT"

  build:
    needs: list-hosts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: ${{ fromJson(needs.list-hosts.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - run: nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
